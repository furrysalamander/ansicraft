[package]
name = "onvif_camera"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "onvif_camera"
path = "src/main.rs"

[lib]
name = "onvif_camera"
path = "src/lib.rs"

[dependencies]
minecraft_terminal_viewer = { path = "../minecraft_terminal_viewer" }
bytes = "1.11"
tokio = { version = "1.49", features = ["full"] }
warp = "0.3"
yaserde = "0.9"
yaserde_derive = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.20", features = ["v4"] }
rcon = "0.5"

[dev-dependencies]
reqwest = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
